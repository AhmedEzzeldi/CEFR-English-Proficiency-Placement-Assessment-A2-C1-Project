<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CEFR English Proficiency Placement Assessment | Ahmed Elaraby</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    input, textarea {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    #watermark-layer {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.05;
      background-repeat: repeat;
      display: none;
    }

    .top-brand-bar {
      width: 100%;
      max-width: 780px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 12px 4px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .container {
      width: 100%;
      max-width: 780px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 10;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .timer-box {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #0f172a;
      border-radius: 999px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      transition: width 0.3s ease;
    }

    h1, h2, h3 { margin-top: 0; }
    p { line-height: 1.6; color: #cbd5e1; }

    .passage-box {
      background: #0f172a;
      border-left: 4px solid var(--primary);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 0.98rem;
      line-height: 1.7;
      color: #e2e8f0;
    }

    .section-briefing-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 26px 22px;
      margin: 8px 0;
    }

    .briefing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .countdown-pill {
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid var(--primary);
      color: #60a5fa;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .briefing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .briefing-item {
      background: #1e293b;
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 10px;
    }

    .briefing-item small {
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .briefing-item strong {
      color: #fff;
      font-size: 1rem;
    }

    .question-text {
      font-size: 1.12rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 10px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.08);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.2);
      font-weight: 600;
    }

    input[type="text"], textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      line-height: 1.6;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 13px 24px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-accent { background: var(--accent); }
    .btn-accent:hover:not(:disabled) { background: #059669; }
    .btn-danger { background: var(--danger); }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 10px;
    }

    .alert-banner {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #cbd5e1;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.92rem;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--danger);
      color: white;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 600;
      z-index: 10000;
      box-shadow: 0 10px 15px rgba(0,0,0,0.5);
      display: none;
      text-align: center;
    }

    .recording-pulse {
      width: 12px;
      height: 12px;
      background: var(--danger);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .audio-item {
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid var(--card-border);
    }

    /* Hidden Offscreen PDF Template */
    #hidden-pdf-container {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 794px;
      background: #ffffff;
      color: #0f172a;
      z-index: -1;
    }

    #pdf-template-wrapper {
      background: #ffffff;
      color: #0f172a;
      padding: 32px;
      font-family: 'Segoe UI', Arial, sans-serif;
      line-height: 1.5;
    }
    .pdf-header {
      border-bottom: 3px solid #1e3a8a;
      padding-bottom: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .pdf-title {
      color: #1e3a8a;
      font-size: 22px;
      font-weight: 800;
      margin: 0;
    }
    .pdf-subtitle {
      color: #475569;
      font-size: 13px;
      margin: 4px 0 0 0;
    }
    .pdf-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .pdf-section-title {
      background: #1e3a8a;
      color: #ffffff;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 4px;
      margin: 20px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pdf-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .pdf-table th, .pdf-table td {
      border: 1px solid #cbd5e1;
      padding: 8px 10px;
      text-align: left;
    }
    .pdf-table th {
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 700;
    }
    .pdf-text-block {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-left: 4px solid #3b82f6;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 12.5px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .pdf-security-alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12.5px;
      margin-bottom: 14px;
    }
    .pdf-security-clean {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12.5px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div id="watermark-layer"></div>
  <div id="toast" class="toast"></div>

  <div class="top-brand-bar">
    <span><strong>CEFR Assessment Portal</strong></span>
    <span>Designed & Built by <strong>Ahmed Elaraby</strong></span>
  </div>

  <div class="container" id="app"></div>
  <div id="hidden-pdf-container"></div>

  <script>
    // ================= 1. BROWSER CHECK =================
    function isInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      return /FBAN|FBAV|Instagram|WhatsApp|Messenger|Line/i.test(ua);
    }

    // ================= 2. GLOBAL ENGLISH-ONLY & ANTI-CHEATING ENGINE =================
    const securityLog = {
      tabSwitches: 0,
      awaySeconds: 0,
      lastHiddenTime: null,
      copyAttempts: 0
    };

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { toast.style.display = 'none'; }, 3200);
    }

    let testActive = false;

    function filterEnglishOnly(str) {
      let result = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i);
        if ((code >= 32 && code <= 126) || code === 10 || code === 13) {
          result += str[i];
        }
      }
      return result;
    }

    document.addEventListener('input', (e) => {
      const target = e.target;
      if (target.tagName !== 'INPUT' && target.tagName !== 'TEXTAREA') return;

      const original = target.value;
      let cleaned = original;

      if (target.id === 'cand-phone') {
        cleaned = original.replace(/[^0-9+]/g, '');
        if (cleaned.indexOf('+') > 0) {
          cleaned = cleaned.replace(/\+/g, '');
        }
        if (cleaned !== original) {
          target.value = cleaned;
          showToast('⚠️ WhatsApp number must contain English digits (0-9) only!');
        }
      } else if (target.id === 'cand-name') {
        cleaned = original.replace(/[^a-zA-Z ]/g, '');
        if (cleaned !== original) {
          target.value = cleaned;
          showToast('⚠️ Please enter your name using English letters only!');
        }
      } else {
        cleaned = filterEnglishOnly(original);
        if (cleaned !== original) {
          target.value = cleaned;
          showToast('⚠️ Only English characters are permitted in this assessment!');
        }
      }
    }, true);

    ['copy', 'cut', 'paste', 'drop'].forEach(evt => {
      document.addEventListener(evt, e => {
        if (!testActive) return;
        e.preventDefault();
        securityLog.copyAttempts++;
        showToast('⚠️ ' + evt.toUpperCase() + ' is strictly prohibited during the exam!');
      }, true);
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && ['U', 'S', 'P', 'C', 'V', 'X'].includes(e.key.toUpperCase()))
      ) {
        if (testActive) {
          e.preventDefault();
          securityLog.copyAttempts++;
          showToast('⚠️ Action blocked by exam security!');
        }
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!testActive) return;
      if (document.hidden) {
        securityLog.tabSwitches++;
        securityLog.lastHiddenTime = Date.now();
      } else if (securityLog.lastHiddenTime) {
        const diff = Math.round((Date.now() - securityLog.lastHiddenTime) / 1000);
        securityLog.awaySeconds += diff;
        securityLog.lastHiddenTime = null;
        showToast('⚠️ Tab switch #' + securityLog.tabSwitches + ' logged (' + diff + 's away)!');
      }
    });

    function setupWatermark(name, phone) {
      const wm = document.getElementById('watermark-layer');
      const canvas = document.createElement('canvas');
      canvas.width = 320;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.rotate(-22 * Math.PI / 180);
      ctx.fillText(name + ' | ' + phone, 10, 110);
      wm.style.backgroundImage = 'url(' + canvas.toDataURL() + ')';
      wm.style.display = 'block';
    }

    // ================= 3. SECTION BRIEFING METADATA =================
    const SECTION_BRIEFS = {
      'Grammar & Vocabulary': {
        partNum: 'Part 1 of 5',
        title: 'Grammar & Vocabulary',
        questionCount: '10 Questions (A2 – C1)',
        format: 'Multiple Choice & Single-Word Gap Fill',
        timing: '20 – 30 seconds per question',
        instructions: 'Read each sentence carefully and select the grammatically accurate option or type the single missing word. Once you move forward, you cannot return.'
      },
      'Reading Comprehension': {
        partNum: 'Part 2 of 5',
        title: 'Reading Comprehension',
        questionCount: '12 Questions across 3 Graded Passages',
        format: 'Multiple Choice & Text-Based Gap Fill',
        timing: '35 – 50 seconds per question',
        instructions: 'You will read three short passages ranging from everyday topics to analytical texts. Scan for key details and main arguments quickly.'
      },
      'Listening Comprehension': {
        partNum: 'Part 3 of 5',
        title: 'Listening Comprehension',
        questionCount: '8 Questions across 2 Audio Clips',
        format: 'Multiple Choice & Single-Word Gap Fill',
        timing: '35 – 45 seconds per question',
        instructions: 'Each audio clip can be played a maximum of 2 times. Listen carefully for specific numbers, names, and main ideas.'
      },
      'Writing Assessment': {
        partNum: 'Part 4 of 5',
        title: 'Writing Assessment',
        questionCount: '2 Written Tasks (B1 Email & C1 Essay)',
        format: 'Structured Free-Text Response',
        timing: 'Task 1: 3m 30s | Task 2: 5m 00s',
        instructions: 'Write clear, well-organized English responses meeting the target word count. Copy/paste is disabled.'
      },
      'Speaking Assessment': {
        partNum: 'Part 5 of 5',
        title: 'Speaking Assessment',
        questionCount: '3 Spoken Prompts (A2, B1-B2, C1)',
        format: 'Live Microphone Recording',
        timing: '7s reading + 35s to 60s speaking per prompt',
        instructions: 'For each prompt, you have 7 seconds to read the question before the microphone starts recording automatically. Speak clearly at a natural pace.'
      }
    };

    // ================= 4. EXAM QUESTION BANK =================
    const PASSAGES = {
      read_a2: "Many companies today allow their employees to work from home. This is called remote work. People like it because they save money on transport and spend less time in traffic. However, some workers feel lonely because they do not see their colleagues every day. To solve this problem, many teams use video calls to stay connected and share ideas.",
      read_b1: "Psychologists suggest that nearly 40% of our daily actions are not conscious decisions, but habits. Every habit follows a three-step loop: a cue, a routine, and a reward. For instance, feeling stressed (the cue) might trigger someone to check social media (the routine), which provides a temporary distraction (the reward). Breaking a bad habit doesn't mean eliminating the cue; rather, it requires replacing the routine with a healthier alternative while keeping the same reward.",
      read_c1: "As organizations increasingly rely on artificial intelligence to streamline recruitment, concerns regarding algorithmic bias have come to the forefront. Far from being purely objective, AI models trained on historical hiring data inevitably inherit—and often amplify—past human prejudices. If a company historically favored candidates from specific demographics, the algorithm learns to penalize resumes that deviate from that profile, even when explicit identifiers like gender or ethnicity are scrubbed. Consequently, achieving genuine fairness requires continuous auditing rather than blind faith in automation."
    };

    const AUDIO_SCRIPTS = {
      list_b1: {
        title: "Audio Clip 1 (Cafe Reservation)",
        rate: 0.98,
        text: "Hi, I'd like to book a quiet table for four people this Thursday at 6 PM. We're having a small study group meeting, so we'll need access to power outlets for our laptops. Also, one of our members is allergic to nuts, so please make a note of that. My name is Kareem, and my confirmation code is B 4 0 9."
      },
      list_c1: {
        title: "Audio Clip 2 (The Attention Economy)",
        rate: 1.08,
        text: "Modern tech platforms aren't merely selling products; they are competing for a finite resource: human attention. Through variable reward schedules, similar to slot machines, notifications are engineered to trigger dopamine spikes, fostering compulsive checking behaviors. Over time, this constant fragmentation erodes our capacity for deep, sustained cognitive work, leaving us chronically distracted yet feeling strangely productive."
      }
    };

    const OBJECTIVE_QUESTIONS = [
      { id: 'G1', section: 'Grammar & Vocabulary', level: 'A2', type: 'mcq', time: 20, q: 'She ______ to the gym every morning before work, except on weekends.', options: ['go', 'goes', 'is going', 'going'], answer: 'goes' },
      { id: 'G2', section: 'Grammar & Vocabulary', level: 'A2', type: 'mcq', time: 20, q: "We didn't have ______ time to finish the project yesterday.", options: ['many', 'enough', 'a few', 'some'], answer: 'enough' },
      { id: 'G3', section: 'Grammar & Vocabulary', level: 'A2', type: 'gap', time: 20, q: 'Type ONE word: "I was born ______ 1999 in Alexandria."', answer: ['in'] },
      { id: 'G4', section: 'Grammar & Vocabulary', level: 'B1-B2', type: 'mcq', time: 25, q: 'By the time we arrived at the station, the train ______.', options: ['already left', 'has already left', 'had already left', 'was leaving'], answer: 'had already left' },
      { id: 'G5', section: 'Grammar & Vocabulary', level: 'B1-B2', type: 'mcq', time: 25, q: "If I ______ you, I wouldn't accept that job offer without negotiating the salary first.", options: ['am', 'was', 'were', 'had been'], answer: 'were' },
      { id: 'G6', section: 'Grammar & Vocabulary', level: 'B1-B2', type: 'mcq', time: 25, q: 'He is very ______; he always keeps his promises and finishes his tasks on time.', options: ['reliable', 'sensible', 'sensitive', 'available'], answer: 'reliable' },
      { id: 'G7', section: 'Grammar & Vocabulary', level: 'B1-B2', type: 'gap', time: 22, q: 'Type ONE word: "She has been working at this company ______ five years."', answer: ['for'] },
      { id: 'G8', section: 'Grammar & Vocabulary', level: 'C1', type: 'mcq', time: 30, q: "Not only ______ the deadline, but she also delivered work that exceeded everyone's expectations.", options: ['she met', 'did she meet', 'she did meet', 'had she met'], answer: 'did she meet' },
      { id: 'G9', section: 'Grammar & Vocabulary', level: 'C1', type: 'mcq', time: 30, q: 'The new policy was met with ______ resistance from employees who felt their concerns were ignored.', options: ['staunch', 'fragile', 'trivial', 'vague'], answer: 'staunch' },
      { id: 'G10', section: 'Grammar & Vocabulary', level: 'C1', type: 'mcq', time: 30, q: 'Had they known about the traffic jam, they ______ an earlier route.', options: ['would take', 'took', 'would have taken', 'will take'], answer: 'would have taken' },

      { id: 'R1', section: 'Reading Comprehension', level: 'A2', passage: 'read_a2', type: 'mcq', time: 45, q: 'Why do people save money with remote work?', options: ['Companies pay for their internet.', "They don't pay for transportation.", 'They eat less food.'], answer: "They don't pay for transportation." },
      { id: 'R2', section: 'Reading Comprehension', level: 'A2', passage: 'read_a2', type: 'mcq', time: 35, q: 'What is one disadvantage of working from home mentioned in the text?', options: ['Poor internet connection', 'Feeling lonely', 'Working longer hours'], answer: 'Feeling lonely' },
      { id: 'R3', section: 'Reading Comprehension', level: 'A2', passage: 'read_a2', type: 'mcq', time: 35, q: 'How do teams stay connected?', options: ['By meeting at cafes', 'Through video calls', 'By sending letters'], answer: 'Through video calls' },
      { id: 'R4', section: 'Reading Comprehension', level: 'A2', passage: 'read_a2', type: 'gap', time: 35, q: 'Type ONE word from the text: Remote workers spend less time in ______.', answer: ['traffic'] },

      { id: 'R5', section: 'Reading Comprehension', level: 'B1-B2', passage: 'read_b1', type: 'mcq', time: 45, q: 'According to the text, what percentage of daily actions are habits?', options: ['Exactly half', 'Almost 40%', 'More than 60%'], answer: 'Almost 40%' },
      { id: 'R6', section: 'Reading Comprehension', level: 'B1-B2', passage: 'read_b1', type: 'mcq', time: 40, q: 'In the example given, what acts as the "reward"?', options: ['Feeling stressed', 'Checking social media', 'Getting a temporary distraction'], answer: 'Getting a temporary distraction' },

    // ================= 5. STATE & SHUFFLE =================
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    const preparedQuestions = OBJECTIVE_QUESTIONS.map(q => {
      if (q.type === 'mcq') {
        return { ...q, options: shuffleArray(q.options) };
      }
      return q;
    });

      candidatePhone: '',

    function clearTimer() {
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function formatTime(sec) {
      const safeSec = Math.max(0, sec);
      const m = Math.floor(safeSec / 60).toString().padStart(2, '0');
      const s = (safeSec % 60).toString().padStart(2, '0');
      return m + ':' + s;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function startExam() {
      const name = document.getElementById('cand-name').value.trim();
      const phone = document.getElementById('cand-phone').value.trim();

      if (!/^[a-zA-Z ]{3,}$/.test(name)) {
        showToast('⚠️ Please enter a valid full name using English letters only!');
        return;
      }

      const digitsOnly = phone.replace(/[^0-9]/g, '');
      if (!/^\+?[0-9]{10,15}$/.test(phone) || digitsOnly.length < 10) {
        showToast('⚠️ Please enter a valid WhatsApp phone number (10–15 English digits)!');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
      } catch (err) {
        showToast('⚠️ Microphone permission warning: Ensure your mic is enabled for Speaking.');
      }

      state.candidateName = name;
      state.candidatePhone = phone;
      setupWatermark(name, phone);
      testActive = true;
      state.qIndex = 0;

      // Briefing before Section 1 (Grammar & Vocabulary)
      showSectionBriefing(preparedQuestions[0].section, renderObjective);
    }

    // ================= 8. OBJECTIVE SECTION =================
    function renderObjective() {
      clearTimer();

      const total = preparedQuestions.length;
      const pct = Math.round((state.qIndex / total) * 100);

      state.timeLeft = qObj.time;

      let contextHtml = '';
      if (qObj.passage) {
        contextHtml = '<div class="passage-box">' + PASSAGES[qObj.passage] + '</div>';
      } else if (qObj.audio) {
        const clip = AUDIO_SCRIPTS[qObj.audio];
        const playsLeft = 2 - state.audioPlays[qObj.audio];
        contextHtml = `
          <div class="passage-box" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">

      app.innerHTML = `

        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>

    let currentSelectedOption = null;
    function selectOption(btn, val) {
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      currentSelectedOption = val;
    }

    function playListeningAudio(audioKey) {
      if (state.audioPlays[audioKey] >= 2) return;
      window.speechSynthesis.cancel();
      const clip = AUDIO_SCRIPTS[audioKey];
      const utterance = new SpeechSynthesisUtterance(clip.text);
      utterance.lang = 'en-US';
      utterance.rate = clip.rate;

      state.audioPlays[audioKey]++;
      const left = 2 - state.audioPlays[audioKey];
      const playsEl = document.getElementById('plays-left');
      const btnEl = document.getElementById('play-audio-btn');
      if (playsEl) playsEl.textContent = left;
      if (btnEl && left <= 0) btnEl.disabled = true;

      window.speechSynthesis.speak(utterance);
    }

    function submitObjective(timedOut = false) {
      const prevSection = preparedQuestions[state.qIndex].section;
      let userAns = '';

      if (preparedQuestions[state.qIndex].type === 'mcq') {
        userAns = currentSelectedOption || '';
      } else {
        const inp = document.getElementById('gap-input');
        userAns = inp ? inp.value.trim() : '';
      }

      if (!timedOut && !userAns) {
        showToast('Please select or type an English answer before proceeding!');
        return;
      }

      state.objectiveAnswers[preparedQuestions[state.qIndex].id] = userAns;
      currentSelectedOption = null;

      if (state.qIndex + 1 < preparedQuestions.length) {
        state.qIndex++;
        const nextSection = preparedQuestions[state.qIndex].section;
        // Show section briefing ONLY when transitioning to a NEW section (Reading or Listening)
        if (nextSection !== prevSection) {
          showSectionBriefing(nextSection, renderObjective);
        } else {
          renderObjective();
        }
      } else {
        state.wIndex = 0;
        // Briefing before Section 4 (Writing Assessment)
        showSectionBriefing('Writing Assessment', renderWriting);

      const task = WRITING_TASKS[state.wIndex];

    // ================= 10. SPEAKING SECTION =================
    let mediaRecorder = null;
    let activeStream = null;
    let audioChunks = [];
    let recognition = null;
    let finalTranscript = '';
    let interimTranscript = '';
    let isFinishingSpeaking = false;
    let isRecordingActive = false;

    function startSpeakingPrep() {
      clearTimer();
      const task = SPEAKING_TASKS[state.sIndex];
      state.timeLeft = task.prepTime;

      app.innerHTML = `
        <div class="header">
          <span class="badge">Speaking Prompt ${state.sIndex + 1} of ${SPEAKING_TASKS.length} — Reading</span>
          <span class="timer-box" style="color:#fbbf24;" id="timer-display">Starts in: ${state.timeLeft}s</span>
        </div>
        <div class="passage-box" style="font-size:1.15rem; font-weight:600;">
          ${task.prompt}
        </div>
        <p style="color:var(--warning);">Read the prompt carefully. Microphone recording starts automatically at 0s...</p>
      `;

      state.timer = setInterval(() => {
        state.timeLeft--;
        const el = document.getElementById('timer-display');
        if (el) el.textContent = 'Starts in: ' + state.timeLeft + 's';
        if (state.timeLeft <= 0) {
          clearTimer();
          startSpeakingRecord();
        }
      }, 1000);
    }

    function finalizeSpeakingStep(task, blob) {
      const durationSec = Math.max(1, task.speakTime - state.timeLeft);
      const combinedText = (finalTranscript + ' ' + interimTranscript).replace(/\s+/g, ' ').trim();
      const wordCount = combinedText ? combinedText.split(/\s+/).length : 0;
      const wpm = Math.round((wordCount / durationSec) * 60);
      const audioUrl = blob ? URL.createObjectURL(blob) : null;

      state.speakingData.push({
        id: task.id,
        level: task.level,
        transcript: combinedText || (blob ? '[Audio recorded - live speech recognition unavailable on this environment]' : '[Microphone unavailable during recording]'),
        wpm: wpm,
        durationSec: durationSec,
        audioUrl: audioUrl
      });

      isFinishingSpeaking = false;

      if (state.sIndex + 1 < SPEAKING_TASKS.length) {
        state.sIndex++;
        startSpeakingPrep();
      } else {
        testActive = false;
        renderResults();
      }
    }

    function initContinuousSpeechRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) return;

      recognition = new SpeechRec();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let tempInterim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += piece + ' ';
          } else {
            tempInterim += piece;
          }
        }
        interimTranscript = tempInterim;
      };

      recognition.onend = () => {
        if (isRecordingActive && !isFinishingSpeaking) {
          try { recognition.start(); } catch (e) {}
        }
      };

      try { recognition.start(); } catch (e) {}
    }

    async function startSpeakingRecord() {
      clearTimer();
      isFinishingSpeaking = false;
      isRecordingActive = true;
      mediaRecorder = null;
      activeStream = null;
      finalTranscript = '';
      interimTranscript = '';
      audioChunks = [];

      const task = SPEAKING_TASKS[state.sIndex];
      state.timeLeft = task.speakTime;

      app.innerHTML = `
        <div class="header">
          <span class="badge"><span class="recording-pulse"></span> Recording Answer ${state.sIndex + 1} of ${SPEAKING_TASKS.length}</span>
          <span class="timer-box" id="timer-display">${formatTime(state.timeLeft)}</span>
        </div>
        <div class="passage-box" style="font-size:1.15rem; font-weight:600;">
          ${task.prompt}
        </div>
        <p id="mic-status" style="color:#34d399;">🎙️ Initializing microphone...</p>
        <div class="footer-actions">
          <span style="color:var(--muted); font-size:0.85rem;">Recording stops automatically at 00:00</span>
          <button type="button" class="btn btn-danger" id="finish-early-btn" onclick="stopSpeakingRecord()">Finish Answer Early ⏹</button>
        </div>
      `;

      state.timer = setInterval(() => {
        state.timeLeft--;
        const el = document.getElementById('timer-display');
        if (el) el.textContent = formatTime(state.timeLeft);
        if (state.timeLeft <= 0) {
          stopSpeakingRecord();
        }
      }, 1000);

      initContinuousSpeechRecognition();

      try {
        activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(activeStream);
        mediaRecorder.ondataavailable = e => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          if (activeStream) activeStream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          finalizeSpeakingStep(task, blob);
        };
        mediaRecorder.start();
        const statusEl = document.getElementById('mic-status');
        if (statusEl) statusEl.textContent = '🎙️ Recording active! Speak clearly into your microphone...';
      } catch (err) {
        const statusEl = document.getElementById('mic-status');
        if (statusEl) {
          statusEl.style.color = '#fbbf24';
          statusEl.textContent = '⚠️ Microphone unavailable, timer running. Click Finish when done.';
        }
      }
    }

    function stopSpeakingRecord() {
      if (isFinishingSpeaking) return;
      isFinishingSpeaking = true;
      isRecordingActive = false;

      const btn = document.getElementById('finish-early-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Saving...';
      }

      clearTimer();

      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }

      const task = SPEAKING_TASKS[state.sIndex];

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try {
          mediaRecorder.stop();
        } catch (e) {
          if (activeStream) activeStream.getTracks().forEach(t => t.stop());
          finalizeSpeakingStep(task, null);
        }
      } else {
        if (activeStream) activeStream.getTracks().forEach(t => t.stop());
        finalizeSpeakingStep(task, null);
      }
    }

    // ================= 11. SCORING & CLEAN RESULTS SCREEN =================
    function calculateScores() {
      const breakdown = {
        A2: { correct: 0, total: 0 },
        'B1-B2': { correct: 0, total: 0 },
        C1: { correct: 0, total: 0 }
      };
      const sectionBreakdown = {
        'Grammar & Vocabulary': { correct: 0, total: 0 },
        'Reading Comprehension': { correct: 0, total: 0 },
        'Listening Comprehension': { correct: 0, total: 0 }
      };
      const wrongDetails = [];

      preparedQuestions.forEach(q => {
        breakdown[q.level].total++;
        sectionBreakdown[q.section].total++;
        const userAns = (state.objectiveAnswers[q.id] || '').trim().toLowerCase();
        let isCorrect = false;

        if (q.type === 'mcq') {
          isCorrect = userAns === q.answer.toLowerCase();
        } else {
          isCorrect = q.answer.map(a => a.toLowerCase()).includes(userAns);
        }

        if (isCorrect) {
          breakdown[q.level].correct++;
          sectionBreakdown[q.section].correct++;
        } else {
          wrongDetails.push(q.id + ' (' + q.level + '): "' + (state.objectiveAnswers[q.id] || 'BLANK') + '"');
        }
      });

      const totalCorrect = breakdown.A2.correct + breakdown['B1-B2'].correct + breakdown.C1.correct;
      return { breakdown, sectionBreakdown, totalCorrect, totalQuestions: preparedQuestions.length, wrongDetails };
    }

    function renderResults() {
      clearTimer();
      const scores = calculateScores();
      const dateStr = new Date().toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
      const hasSecurityFlags = securityLog.tabSwitches > 0 || securityLog.copyAttempts > 0;

      const w1Words = (state.writingAnswers['W1'] || '').trim().split(/\s+/).filter(Boolean).length;
      const w2Words = (state.writingAnswers['W2'] || '').trim().split(/\s+/).filter(Boolean).length;

      document.getElementById('hidden-pdf-container').innerHTML = `
        <div id="pdf-template-wrapper">
          <div class="pdf-header">
            <div>
              <h1 class="pdf-title">CEFR ENGLISH PLACEMENT REPORT</h1>
              <p class="pdf-subtitle">Comprehensive Diagnostic Assessment (A2 – C1)</p>
            </div>
            <div style="text-align:right; font-size:12px; color:#64748b;">
              <strong>Date:</strong> ${dateStr}<br>
              <strong>Status:</strong> Pending Final Evaluation
            </div>
          </div>

          <div class="pdf-meta-grid">
            <div><strong>Candidate Name:</strong> ${escapeHtml(state.candidateName)}</div>
            <div><strong>WhatsApp Contact:</strong> ${escapeHtml(state.candidatePhone)}</div>
            <div><strong>Objective Score:</strong> ${scores.totalCorrect} / ${scores.totalQuestions} (${Math.round((scores.totalCorrect/scores.totalQuestions)*100)}%)</div>
            <div><strong>Assessment Mode:</strong> Official Proctored</div>
          </div>

          <div class="${hasSecurityFlags ? 'pdf-security-alert' : 'pdf-security-clean'}">
            <strong>Proctoring & Integrity Log:</strong>
            Tab/App Switches: <strong>${securityLog.tabSwitches}</strong> |
            Total Time Away: <strong>${securityLog.awaySeconds}s</strong> |
            Blocked Copy/Paste Attempts: <strong>${securityLog.copyAttempts}</strong>
          </div>

          <div class="pdf-section-title">1. Objective Skills Breakdown</div>
          <table class="pdf-table">
            <thead>
              <tr>
                <th>CEFR Band</th>
                <th>Score</th>
                <th>Accuracy</th>
                <th>Skill Section</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>A2 Foundation</strong></td>
                <td>${scores.breakdown.A2.correct} / ${scores.breakdown.A2.total}</td>
                <td>${Math.round((scores.breakdown.A2.correct / scores.breakdown.A2.total) * 100)}%</td>
                <td>Grammar & Vocabulary</td>
                <td>${scores.sectionBreakdown['Grammar & Vocabulary'].correct} / ${scores.sectionBreakdown['Grammar & Vocabulary'].total}</td>
              </tr>
              <tr>
                <td><strong>B1–B2 Intermediate</strong></td>
                <td>${scores.breakdown['B1-B2'].correct} / ${scores.breakdown['B1-B2'].total}</td>
                <td>${Math.round((scores.breakdown['B1-B2'].correct / scores.breakdown['B1-B2'].total) * 100)}%</td>
                <td>Reading Comprehension</td>
                <td>${scores.sectionBreakdown['Reading Comprehension'].correct} / ${scores.sectionBreakdown['Reading Comprehension'].total}</td>
              </tr>
              <tr>
                <td><strong>C1 Advanced</strong></td>
                <td>${scores.breakdown.C1.correct} / ${scores.breakdown.C1.total}</td>
                <td>${Math.round((scores.breakdown.C1.correct / scores.breakdown.C1.total) * 100)}%</td>
                <td>Listening Comprehension</td>
                <td>${scores.sectionBreakdown['Listening Comprehension'].correct} / ${scores.sectionBreakdown['Listening Comprehension'].total}</td>
              </tr>
            </tbody>
          </table>
          <div style="font-size:12px; color:#475569; margin-bottom:10px;">
            <strong>Missed Items Diagnostic:</strong> ${escapeHtml(scores.wrongDetails.join(' | ') || 'None - Perfect Score!')}
          </div>

          <div class="pdf-section-title">2. Writing Assessment Submissions</div>
          <div style="font-size:12.5px; font-weight:700; margin-bottom:4px; color:#1e3a8a;">
            Task 1 (B1 Practical Email) — Word Count: ${w1Words} words
          </div>
          <div class="pdf-text-block">${escapeHtml(state.writingAnswers['W1'] || '[No response]')}</div>

          <div style="font-size:12.5px; font-weight:700; margin-bottom:4px; color:#1e3a8a;">
            Task 2 (C1 Analytical Essay) — Word Count: ${w2Words} words
          </div>
          <div class="pdf-text-block">${escapeHtml(state.writingAnswers['W2'] || '[No response]')}</div>

          <div class="pdf-section-title">3. Speaking Assessment & Fluency Metrics</div>
          ${state.speakingData.map(s => `
            <div style="font-size:12.5px; font-weight:700; margin-bottom:4px; color:#1e3a8a;">
              ${s.id} (${s.level}) — Duration: ${s.durationSec}s | Estimated Pace: ${s.wpm} WPM
            </div>
            <div class="pdf-text-block">${escapeHtml(s.transcript)}</div>
          `).join('')}

          <div style="margin-top:24px; padding-top:10px; border-top:1px solid #cbd5e1; text-align:center; font-size:11px; color:#64748b;">
            CEFR Placement Assessment System • Designed & Engineered by Ahmed Elaraby
          </div>
        </div>
      `;

      app.innerHTML = `
        <div class="header">
          <span class="badge" style="background:rgba(16,185,129,0.2); color:#34d399; border-color:#059669;">Assessment Completed!</span>
        </div>
        <h2>Thank you, ${escapeHtml(state.candidateName)}!</h2>
        <p>Your assessment has been successfully recorded. Please download your official report and speaking recordings below, then send them on WhatsApp for final CEFR grading:</p>

        <div class="passage-box">
          <strong>Step 1: Download Official Report (PDF)</strong><br>
          <small style="color:#94a3b8;">Contains your diagnostic breakdown, writing submissions, and speaking transcripts.</small><br><br>
          <button class="btn btn-accent" id="download-pdf-btn" onclick="downloadOfficialPDF()">📄 Download For Report</button>
        </div>

        <div class="passage-box">
          <strong>Step 2: Download Speaking Audio Recordings</strong><br>
          <small style="color:#94a3b8;">Save and send these 3 audio files alongside your PDF report.</small><br><br>
          ${state.speakingData.map((s, idx) => s.audioUrl ? `
            <div class="audio-item" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <span>🎙️ Speaking Recording ${idx + 1} (${s.level})</span>
              <div style="display:flex; gap:8px; align-items:center;">
                <audio controls src="${s.audioUrl}" style="height:32px;"></audio>
                <a href="${s.audioUrl}" download="${state.candidateName.replace(/\s+/g,'_')}_Speaking_${idx+1}.webm" class="btn" style="padding:6px 12px; font-size:0.85rem; text-decoration:none;">⬇ Save</a>
              </div>
            </div>
          ` : `
            <div class="audio-item" style="color:#fbbf24;">
              ⚠️ Speaking Recording ${idx + 1} (${s.level}): No audio captured.
            </div>
          `).join('')}
        </div>
      `;
    }

    function downloadOfficialPDF() {
      const btn = document.getElementById('download-pdf-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Generating PDF Report...';
      }

      const element = document.getElementById('pdf-template-wrapper');
      const safeName = state.candidateName.replace(/\s+/g, '_') || 'Candidate';
      const opt = {
        margin: [10, 10, 10, 10],
        filename: safeName + '_English_Placement_Report.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '✅ Report Downloaded! (Click to download again)';
        }
        showToast('✅ Official PDF Report downloaded!');
      }).catch(err => {
        console.error(err);
        if (btn) {
          btn.disabled = false;
          btn.textContent = '📄 Download For Report';
        }
        showToast('⚠️ Error generating PDF. Please try again.');
      });
    }

    renderIntro();
  </script>
</body>
</html>
